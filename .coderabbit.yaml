# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_filters:
    - "!tmp/**"
    - "!.deepsec/**"
    - "!docs/**"
    - "!memory/**"
    - "!licenses/**"
    - "!app/src/main/res/**"
    - "!app/schemas/**"
    - "!app/stability/**"
    - "!gradle/verification-metadata.xml"
    - "!tools/**"
    - "!**/*.md"
    - "!**/*.svg"
    - "!**/*.ttf"
    - "!**/.gitkeep"
    - "!.editorconfig"
    - "!.gitignore"
    - "!.mobsf"
    - "!app/lint.xml"
    - "!config/check-exceptions.json"
    - "!config/dependency-check/**"
    - "!gradle.properties"
    - "!gradle/wrapper/**"
