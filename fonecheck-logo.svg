                             0 0 0 1.0236 -0.1712
                             0 0 0 1.1912 -0.1992
                             0 0 0 0 1"/>
      <feComposite in="sp2" in2="SourceAlpha" operator="in" result="spec"/>
      <feBlend in="spec" in2="shaded" mode="screen" result="lit"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.0" result="hr"/>
      <feSpecularLighting in="hr" surfaceScale="1.0" specularConstant="1"
                          specularExponent="80.0" lighting-color="#ffffff" result="spr">
        <feDistantLight azimuth="248" elevation="57"/>
      </feSpecularLighting>
      <feGaussianBlur in="spr" stdDeviation="2.5" result="sprS"/>
      <feColorMatrix in="sprS" type="matrix" result="spr2"
                     values="0 0 0 1.7066 -0.4528
                             0 0 0 2.1068 -0.5590
                             0 0 0 1.9710 -0.5230
                             0 0 0 0 1"/>
      <feComposite in="spr2" in2="SourceAlpha" operator="in" result="specR"/>
      <feBlend in="specR" in2="lit" mode="screen" result="lit2"/>
      <feComposite in="lit2" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="fxAO" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11.0" result="b"/>
      <feFlood flood-color="#23003D" result="k"/>
      <feComposite in="k" in2="b" operator="in"/>
    </filter>
