<!--
  fonecheck-logo.svg
  Vektoriversio 3D-renderoidusta logosta (fonecheck-logo.png).

  Rakenne
    * Kaksi polkua: turkoosi "f" (takana) ja violetti tarkistusmerkki (edessa).
      Polut on jaljitetty alkuperaisesta bittikartasta; siluetti osuu 1-2 px.
      Turkoosin alaosa jatkuu violetin alle, kuten alkuperaisessa.
    * Perusvari on pystysuora liukuvari - ylaosa on kirkkaampi, kuten
      alkuperaisessa renderissa.
    * Muovimainen 3D-vaikutelma tehdaan valaistussuotimilla, ei kasin
      piirretyilla liukuvareilla. Muodon alfakanavasta sumennetaan
      korkeuskartta, ja siita lasketaan:
        - feDiffuseLighting  = reunojen varjostus (valo ylavasemmalta)
        - feComponentTransfer = hajavalon pohja kanavittain, jotta varjopuolen
          savy vastaa alkuperaista (turkoosi sailyttaa punaista, violetti
          menettaa sinista)
        - feSpecularLighting  = leveampi kiiltoraita bevelilla
        - toinen feSpecularLighting kapeammalla korkeuskartalla = reunapyoristyksen
          kiilto heti siluetin vieressa
      Kiiltokerroksista vahennetaan feColorMatrixilla tasaisen pinnan pohjataso,
      jolloin raita jaa vain reunaan eika levia tasaiselle pinnalle.
    * Valaistustulos sumennetaan kevyesti (stdDeviation 2.5), koska 8-bittisen
      suodinketjun rampin derivaatta juovittuu ilman sita.
    * fxAO = violetin turkoosille heittama kontaktivarjo. Se on olennainen:
      turkoosin varsi jatkuu violetin alle, joten ilman varjoa liitoskohta
      nayttaisi litteasti leikatulta.

  Parametrit on sovitettu mittaamalla alkuperaisen kuvan varit
  etaisyysvyohykkeittain reunasta JA reunan suunnan mukaan. Suunta ratkaisee
  valon atsimuutin: alkuperaisessa oikealle osoittava reuna on selvasti
  vaaleampi kuin alaspain osoittava, mika vastaa atsimuuttia ~248 astetta
  (ei 225:ta, jota symmetrinen "ylavasen" olettaisi).

  Huom: nayttaa oikealta selaimissa (Chrome/Safari/Firefox) ja Inkscapessa.
  Kevyet SVG-rasteroijat (esim. librsvg) eivat tue valaistussuotimia,
  jolloin muodot piirtyvat tasaisina vareina.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" role="img" aria-label="fonecheck">
