name: Temporary dependency metadata and validation

on:
  push:
    branches: [codex/consolidated-dependency-updates]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Generate supply-chain inputs and validate dependency updates
        run: >-
          ./gradlew
          :app:assembleDebug
          :app:assembleRelease
          :app:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :app:lintDebug
          :app:lintRelease
          :app:ktlintCheck
          :app:detekt
          :app:stabilityCheck
          :app:dependencyCheckAnalyze
          --write-locks
          --write-verification-metadata sha256
          --no-daemon
          --console=plain
      - name: Upload generated supply-chain inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dependency-metadata
          path: |
            buildscript-gradle.lockfile
            settings-gradle.lockfile
            gradle/verification-metadata.xml
          if-no-files-found: error
