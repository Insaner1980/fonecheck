name: Android build and static verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Builds, JVM unit tests, debug lint, and runtime dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, test, lint, and scan app runtime dependencies
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:dependencyCheckAnalyze --no-daemon --console=plain || { bash tools/print-gradle-verification-report.sh; exit 1; }

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Code scanning is not enabled for this private repository, so results stay in this job:
    # findings are listed in the log and summary, the SARIF is kept as an artifact, and an
    # error-level finding fails the job. Nothing is uploaded to the Security tab.
    permissions:
      # CodeQL reads its own workflow run; a private repository's token needs this explicitly.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build Android sources for CodeQL
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain || { bash tools/print-gradle-verification-report.sh; exit 1; }
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        id: codeql-analyze
        with:
          category: "/language:java-kotlin"
          upload: never
          upload-database: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.codeql-analyze.outputs.sarif-output != '' }}
        with:
          name: codeql-sarif
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: error
      - name: Report CodeQL findings
        if: ${{ !cancelled() && steps.codeql-analyze.outcome == 'success' }}
        env:
          SARIF_DIR: ${{ steps.codeql-analyze.outputs.sarif-output }}
        run: bash tools/report-codeql-sarif.sh "$SARIF_DIR"

  semgrep-osv:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.171.0@sha256:bdf7013b2c3634a487671158da77c554f531742326b543a9464d2adf6c433ac8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: semgrep scan --error --strict --metrics=off --disable-version-check --config config/semgrep/fonecheck-security.yml .

  osv:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified OSV-Scanner
        shell: bash
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 \
            --output "$RUNNER_TEMP/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Run OSV-Scanner
        shell: bash
        run: |
          echo "Scope: .deepsec and buildscript-gradle.lockfile only; app Gradle runtime dependencies and unlisted lockfiles are not covered by this job."
          "$RUNNER_TEMP/osv-scanner" scan source --recursive .deepsec
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile buildscript-gradle.lockfile --config gradle/osv-scanner.toml
